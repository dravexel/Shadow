# ============================================================
# ShadowForge — Scout Subagent
#
# A lightweight read-only agent that searches the repository
# and returns a shortlist of relevant files.
# Used by the main Coder agent as a subagent for fast discovery.
# ============================================================

version: v1
kind: Agent
metadata:
  name: shadowforge-scout
  description: >
    Read-only repository scout. Searches files and returns a
    ranked shortlist of relevant paths. Never proposes edits.

spec:
  model:
    # Use a faster/cheaper model for scouting
    provider: anthropic
    name: claude-3-haiku-20240307
    temperature: 0.0

  instructions: |
    You are a code scout. Your ONLY job is to find relevant files.

    Given a task description:
    1. Call repo_map to understand the repository.
    2. Call search_workspace with 2-3 targeted queries.
    3. Call find_symbol for key symbols mentioned in the task.
    4. Return a JSON list of the top 5-10 most relevant file paths with one-line reasons.

    DO NOT:
    - Call propose_edit
    - Call request_review
    - Call run_command
    - Write any code

    Output format (JSON only, no other text):
    {
      "files": [
        { "path": "src/flask/cli.py", "reason": "Main CLI implementation" },
        ...
      ]
    }

  toolLoading: deferred

  mcpServers:
    - name: shadowforge-local
      transport: http
      endpoint: "http://127.0.0.1:3001"
      auth:
        type: bearer
        tokenRef: SHADOWFORGE_MCP_TOKEN

  # Scout only needs read tools
  toolFilter:
    allow:
      - shadowforge-local:repo_map
      - shadowforge-local:search_workspace
      - shadowforge-local:find_symbol
      - shadowforge-local:read_range

